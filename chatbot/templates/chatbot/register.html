<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register - Conversio</title>
{% load static %}
<link rel="stylesheet" href="{% static 'chatbot/css/style.css' %}">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <img src="{% static 'chatbot/logo.png' %}" alt="Conversio">
      <span>Conversio</span>
    </div>
    <h2>Create your account</h2>
    <p class="auth-subtitle">Get started with Conversio AI</p>
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Choose a username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Create a password" required>
      </div>
      <div class="form-group">
        <label for="confirm_password">Confirm Password</label>
        <input type="password" id="confirm_password" name="confirm_password" placeholder="Confirm your password" required>
      </div>
      {% if error %}<p class="auth-error">{{ error }}</p>{% endif %}
      <button type="submit" class="btn-primary">Create Account</button>
    </form>
    <p class="auth-link">Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
  </div>
</div>
</body>
</html>
